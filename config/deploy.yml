service: plazachapina

image: lenchoreyes/plazachapina

servers:
  web:
    - kamal-a

proxy:
  ssl: true
  host: plazachapina.ca
  app_port: 3000

registry:
  username: lcreid@jadesystems.ca

  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  secret:
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - RAILS_MASTER_KEY
  clear:
    DATABASE_HOST: plazachapina-db

ssh:
  user: deploy

asset_path: /rails/public/assets

accessories:
  db:
    image: postgres:17-alpine
    host: kamal-a
    env:
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
    directories:
      - postgres:/var/lib/postgresql/data

  backup:
    image: ghcr.io/crmne/kamal-backup:0.5.0
    host: kamal-a
    files:
      - config/kamal-backup.yml:/app/config/kamal-backup.yml:ro
    env:
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
        - RESTIC_PASSWORD
    volumes:
      # - chapina_storage:/storage
      - chapina_backup_state:/var/lib/kamal-backup
